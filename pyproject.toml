[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kaggle-agents-foundation"
version = "0.1.0.dev0"
description = "Reproducible, budgeted experiment tools for competition projects"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.11,<3", "psutil>=7,<8"]

[project.scripts]
kaggle-agents = "kaggle_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
